<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>come · do · put · take: Collocation Practice</title>
<style>
:root{
  --purple:#8E2A8B; --purple-d:#6E1E6B; --purple-l:#F5E9F5;
  --come:#8E2A8B; --put:#D96A12; --do:#148F80; --take:#3455C9;
  --ok:#1E9E5A; --ok-l:#E3F6EC; --bad:#D6334B; --bad-l:#FCE8EB;
  --ink:#2B223A; --grey:#6B6575; --line:#E6E0EC; --bg:#F7F4FA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Calibri,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:17px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- header ---------- */
header{background:var(--purple);color:#fff;padding:18px 24px 14px}
.hwrap{max-width:1060px;margin:0 auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.htitle{flex:1;min-width:260px}
.htitle small{letter-spacing:.12em;font-weight:700;opacity:.8;font-size:12px}
.htitle h1{margin:2px 0 0;font-size:28px;line-height:1.15}
.htitle h1 span{opacity:.55;font-weight:400}
.scorebox{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 16px;min-width:210px}
.scorebox .lbl{font-size:12px;letter-spacing:.08em;opacity:.85;font-weight:700}
.scorebox .snum{font-size:22px;font-weight:800}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}

/* ---------- stepper ---------- */
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.steps{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
.step{flex:0 0 auto;height:34px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--grey);display:flex;align-items:center;gap:6px;white-space:nowrap}
.step .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.step.active{border-color:var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 8%,#fff)}
.step.done .dot{background:var(--ok)}
.step.part .dot{background:#E9A23B}

/* ---------- main card ---------- */
main{max-width:1060px;margin:22px auto 40px;padding:0 16px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(60,30,80,.07);overflow:hidden}
.stagebar{color:#fff;padding:9px 24px;font-size:13px;font-weight:700;letter-spacing:.1em}
.stagebar em{font-style:normal;font-weight:400;letter-spacing:0;opacity:.9;margin-left:8px}
.cbody{padding:22px 26px 26px}
.cbody h2{margin:0 0 4px;font-size:25px}
.cbody h2 b{color:var(--purple);margin-right:8px}
.instr{color:var(--grey);margin:0 0 18px;font-style:italic}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{border:none;border-radius:11px;padding:10px 18px;font-weight:700;background:var(--purple);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--purple);border:2px solid var(--purple)}
.btn.soft{background:var(--purple-l);color:var(--purple)}
.feedback{font-weight:700;padding:8px 14px;border-radius:10px;display:none}
.feedback.show{display:inline-block}
.feedback.good{background:var(--ok-l);color:var(--ok)}
.feedback.mid{background:#FFF4E0;color:#B36B00}
.feedback.low{background:var(--bad-l);color:var(--bad)}
.pager{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

/* ---------- learn grid ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lcard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.lcard img{width:100%;display:block;aspect-ratio:600/327;object-fit:cover}
.lcard .lc{padding:10px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.lcard .ph{font-weight:800;font-size:17px;line-height:1.25}
.lcard .mn{font-size:14.5px}
.lcard .ex{font-size:14px;color:var(--grey);font-style:italic}
.say{border:none;background:var(--purple-l);color:var(--purple);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;align-self:flex-start;margin-top:auto}
.vb{font-weight:800}
.v-come{color:var(--come)}.v-put{color:var(--put)}.v-do{color:var(--do)}.v-take{color:var(--take)}

/* ---------- chips & placing ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed #D8CCE0;border-radius:14px;background:#FCFAFD;min-height:58px;margin-bottom:16px}
.bank.empty::after{content:"All placed! Now press Check.";color:var(--grey);font-style:italic;font-size:14px;align-self:center}
.chip{background:#fff;border:2px solid #CDBFD8;border-radius:999px;padding:5px 13px;font-weight:600;font-size:15px;user-select:none;cursor:grab;transition:transform .1s, box-shadow .1s}
.chip:hover{border-color:var(--purple)}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff;transform:translateY(-2px);box-shadow:0 4px 10px rgba(142,42,139,.3)}
.chip.ok{background:var(--ok-l);border-color:var(--ok);color:#13643A}
.chip.bad{background:var(--bad-l);border-color:var(--bad);color:#9B1B2E}
.tip{font-size:14px;color:var(--grey);margin:-6px 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.pcard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.pcard img{width:100%;display:block}
.slot{min-height:48px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:6px;gap:6px;background:#FCFAFD;cursor:pointer}
.slot .letter{font-weight:800;color:var(--purple)}
.slot.hot{background:#F3E7F4}
.slot.okz{background:var(--ok-l)}.slot.badz{background:var(--bad-l)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.cols{grid-template-columns:repeat(2,1fr)}}
.col{border:2px solid var(--line);border-radius:14px;overflow:hidden;min-height:180px;display:flex;flex-direction:column;cursor:pointer}
.col h3{margin:0;color:#fff;text-align:center;padding:7px;font-size:18px;letter-spacing:.06em}
.col .zone{flex:1;display:flex;flex-direction:column;gap:7px;padding:10px;align-items:flex-start}
.col.hot{box-shadow:0 0 0 3px rgba(142,42,139,.25)}

/* ---------- matching ---------- */
.mrow{display:grid;grid-template-columns:28px minmax(180px,1fr) minmax(220px,1.6fr) 28px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.num{font-weight:800;color:var(--purple)}
select{min-width:0;max-width:100%;padding:8px 10px;border:2px solid #D3C7DC;border-radius:10px;background:#fff;width:100%}
.mark{font-weight:900;font-size:20px;text-align:center}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}

/* ---------- MC ---------- */
.mc{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.opts{display:inline-flex;gap:5px;margin:0 4px;vertical-align:middle}
.opt{border:2px solid #D3C7DC;background:#fff;border-radius:9px;padding:1px 10px;font-weight:700;color:var(--ink)}
.opt.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- inputs ---------- */
.tin{border:2px solid #D3C7DC;border-radius:9px;padding:6px 10px;background:#fff;outline:none;transition:border-color .15s}
.tin:focus{border-color:var(--purple)}
.tin.ok{border-color:var(--ok);background:var(--ok-l)}
.tin.bad{border-color:var(--bad);background:var(--bad-l)}
.wide{width:100%}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item .q{margin-bottom:7px}
.item .q .kw{background:var(--purple);color:#fff;font-weight:800;border-radius:6px;padding:1px 8px;font-size:14px;margin-left:6px;letter-spacing:.05em}
.extra{color:var(--purple);font-weight:800}
.frame{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.answer{display:none;font-size:14.5px;color:var(--ok);font-weight:600;margin-top:5px}
.answer.show{display:block}
.example{background:var(--purple-l);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15.5px}
table.forms{border-collapse:collapse;width:100%;max-width:720px}
table.forms th{background:var(--purple);color:#fff;text-align:left;padding:8px 12px}
table.forms td{border:1px solid var(--line);padding:8px 12px}
.inline{width:110px;padding:3px 8px}
.story{background:#FCFAFD;border:1px solid var(--line);border-radius:14px;padding:18px 20px;line-height:2.35;font-size:17.5px}
.gap{display:inline-flex;align-items:center;white-space:nowrap}
.gap b{color:var(--purple);font-size:17px}
.gap .tin{padding:1px 6px;border-radius:7px}
.gnum{display:inline-block;background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:12.5px;font-weight:800;margin-right:4px;vertical-align:middle}

/* ---------- speaking / writing ---------- */
.qcard{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.qcard .qq{font-weight:700;margin-bottom:8px}
textarea{width:100%;border:2px solid #D3C7DC;border-radius:10px;padding:10px 12px;resize:vertical;outline:none}
textarea:focus{border-color:var(--purple)}
.detect{font-size:14px;margin-top:6px;font-weight:700}
.detect.ok{color:var(--ok)}.detect.no{color:var(--grey);font-weight:500}
.model{display:none;margin-top:8px;background:var(--purple-l);border-radius:10px;padding:8px 12px;font-size:15px}
.model.show{display:block}
.linkbtn{background:none;border:none;color:var(--purple);font-weight:700;padding:0;font-size:14px;text-decoration:underline}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:12px 0}
.ck{border:2px solid var(--line);border-radius:10px;padding:7px 11px;font-size:15px;font-weight:600;color:var(--grey);transition:all .2s}
.ck.on{border-color:var(--ok);background:var(--ok-l);color:#13643A}
.ck::before{content:"☐ ";}.ck.on::before{content:"✔ ";}
.wc{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;margin-top:8px}

/* ---------- flashcards ---------- */
.fcwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(560px,100%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fci{position:relative;width:100%}
/* simple 2-side card: only one face is displayed at a time (no 3D, works in Safari/iPad too) */
.face{display:none;min-height:390px;border-radius:18px;border:2px solid var(--line);background:#fff;overflow:hidden;flex-direction:column}
.fc:not(.flip) .front{display:flex;animation:flipIn .28s ease-out}
.fc.flip .back{display:flex;animation:flipIn .28s ease-out}
@keyframes flipIn{from{transform:scaleX(.05);opacity:.4}to{transform:scaleX(1);opacity:1}}
.face img{width:100%;display:block}
.face .fm{padding:14px 18px;font-size:18px;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.back{align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;background:var(--purple-l)}
.back .big{font-size:30px;font-weight:800;line-height:1.2}
.back .ex{font-style:italic;color:var(--grey)}
.back .say{margin-top:6px;align-self:center;font-size:15px;padding:5px 12px}
.fcbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.fcstat{font-weight:700;color:var(--grey)}
.fcdone{text-align:center;padding:30px}
.fcdone .big{font-size:46px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media(max-width:560px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}.slot .chip{font-size:13px;padding:3px 8px}.mrow{grid-template-columns:24px minmax(0,1fr) 24px;grid-template-areas:'n p m' 'n s s'}.mrow .num{grid-area:n}.mrow>span:nth-child(2){grid-area:p}.mrow select{grid-area:s}.mrow .mark{grid-area:m}.htitle h1{font-size:23px}.cbody{padding:18px 16px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htitle"><small>VOCABULARY PRACTICE</small>
      <h1>come <span>·</span> do <span>·</span> put <span>·</span> take</h1></div>
    <div class="scorebox"><div class="lbl">MY SCORE</div><div class="snum" id="scoreNum">0 / 0</div><div class="bar"><i id="scoreBar"></i></div></div>
  </div>
</header>
<nav><div class="steps" id="steps"></div></nav>
<main><div class="card" id="card"></div>
  <div class="pager"><button class="btn ghost" id="prev">← Back</button><button class="btn" id="next">Next →</button></div>
</main>

const DETECT = {

  pressure:/\b(put|puts|putting)\s+(\w+\s+){0,4}(under|on)\s+(\w+\s+){0,3}pressure\b|\b(put|puts|putting)\s+(\w+\s+){0,3}pressure\s+on\b/,

  granted:/\b(take|takes|took|taking|taken)\s+(\w+\s+){0,4}for\s+granted\b/
};

/* ---------------- helpers ---------------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return el;
}
const norm = s => s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
const expand = s => norm(s).replace(/\bwon't\b/g,"will not").replace(/\bdoesn't\b/g,"does not").replace(/\bdon't\b/g,"do not").replace(/\bi've\b/g,"i have").replace(/\bit's\b/g,"it is");
function same(a, list){ const x = expand(a); return list.some(b => expand(b) === x); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function vb(verb, rest){ return h("span", null, h("span",{class:"vb v-"+verb}, verb), rest); }
function phraseEl(c){ return vb(c.verb, c.phrase.slice(c.verb.length)); }
const canSpeak = "speechSynthesis" in window;
function speak(t){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=.88; speechSynthesis.speak(u);}catch(e){}
}
function sayBtn(text){ return canSpeak ? h("button",{class:"say", title:"Listen", onclick:e=>{e.stopPropagation(); speak(text);}}, "🔊 listen") : null; }
function mark(el, ok){ el.classList.remove("ok","bad"); el.classList.add(ok ? "ok" : "bad"); if(!ok){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }
function clearMarks(root){ root.querySelectorAll(".ok,.bad,.okz,.badz").forEach(e=>e.classList.remove("ok","bad","okz","badz")); root.querySelectorAll(".mark").forEach(m=>m.textContent=""); root.querySelectorAll(".answer").forEach(a=>a.classList.remove("show")); }

/* ---------- tap-or-drag placer ---------- */
function makePlacer(bank, targets){
  // targets: [{el (click area), zone (where chips go), single:boolean}]
  let sel = null, dragging = null;
  const chips = () => [...bank.parentNode.querySelectorAll(".chip")];
  function refreshBank(){ bank.classList.toggle("empty", !bank.querySelector(".chip")); }
  function select(chip){
    if (sel === chip){ chip.classList.remove("sel"); sel = null; return; }
    if (sel) sel.classList.remove("sel");
    sel = chip; chip.classList.add("sel");
  }
  function place(chip, t){
    if (t && t.single){ const ex = t.zone.querySelector(".chip"); if (ex && ex !== chip) bank.appendChild(ex); }
    (t ? t.zone : bank).appendChild(chip);
    chip.classList.remove("sel","ok","bad"); sel = null;
    if (t) t.el.classList.remove("okz","badz");
    refreshBank();
  }
  function wireChip(chip){
    chip.draggable = true;
    chip.addEventListener("click", e => { e.stopPropagation(); select(chip); });
    chip.addEventListener("dragstart", e => { dragging = chip; e.dataTransfer.setData("text/plain","x"); });
  }
  bank.querySelectorAll(".chip").forEach(wireChip);
  const all = [{el:bank, zone:bank, isBank:true}, ...targets];
  all.forEach(t => {
    t.el.addEventListener("click", () => { if (sel) place(sel, t.isBank ? null : t); });
    t.el.addEventListener("dragover", e => { e.preventDefault(); t.el.classList.add("hot"); });
    t.el.addEventListener("dragleave", () => t.el.classList.remove("hot"));
    t.el.addEventListener("drop", e => { e.preventDefault(); t.el.classList.remove("hot"); if (dragging) place(dragging, t.isBank ? null : t); dragging = null; });
  });
  refreshBank();
  return {
    reset(){ chips().forEach(c => { c.classList.remove("ok","bad","sel"); bank.appendChild(c); }); shuffle([...bank.children]).forEach(c=>bank.appendChild(c)); sel=null; refreshBank(); },
    put(chip, t){ place(chip, t); }
  };
}

/* ---------- 3. MATCH MEANINGS ---------- */

/* ---------- 4. CHOOSE THE VERB ---------- */
ACTS.push({stage:2, num:"4", nav:"Choose", title:"Choose the correct verb",

      show(){ groups.forEach(g => { g.btns.forEach(x=>x.classList.remove("sel","bad","ok")); const bt=g.btns.find(x=>x.dataset.o===g.correct); bt.classList.add("ok"); g.chosen=g.correct; }); },

/* ---------- 5. MAKE IT STRONGER ---------- */

/* ---------- 7. STORY ---------- */

      i.addEventListener("input",()=>i.classList.remove("ok","bad"));

      "When the TV channel announced that its most popular comedy show was ending, it ", n(1), gap("came"), " as quite a ", gap("shock"),

      " in it during a live interview with a famous actor. Newspapers ", n(3), gap("put"), " the channel ", gap("under"), " a lot of ", gap("pressure"),
      " to apologise, and soon the show was cancelled. Many fans were sad that such a successful programme had ", n(4), gap("come"), " to an ", gap("untimely"), " ", gap("end"),
      " because of one silly joke. “One joke doesn’t ", n(5), gap("do"), " any ", gap("harm"), ",” said one viewer. After all, the show had ", n(6), gap("done"), " very ", gap("well"),

    ];

/* ---------- 9. LET'S TALK ---------- */

/* ---------- 10. STORY CHALLENGE ---------- */
ACTS.push({stage:4, num:"10", nav:"Write", title:"Story challenge",
  instr:"Write a short story (80–100 words) using at least FIVE collocations. Each one lights up when you use it correctly.",
  build(body){
    const ticks = {};
    const list = h("div",{class:"checklist"}, COLL.map(c => (ticks[c.id] = h("div",{class:"ck"}, c.short))));
    const ta = h("textarea",{rows:"9", placeholder:"Once upon a time…"});
    const wc = h("span",null,"Words: 0"), cc = h("span",null,"Collocations: 0 / 5"), msg = h("span",{style:"color:var(--ok)"});
    ta.addEventListener("input", () => {
      const t = norm(ta.value), words = t ? t.split(" ").length : 0;
      let n = 0; COLL.forEach(c => { const on = DETECT[c.id].test(t); if (on && !ticks[c.id].classList.contains("on")){ ticks[c.id].classList.add("pop"); } ticks[c.id].classList.toggle("on", on); if(on) n++; });
      wc.textContent = "Words: " + words; wc.style.color = words>=80 && words<=100 ? "var(--ok)" : words>100 ? "var(--bad)" : "";
      cc.textContent = "Collocations: " + n + " / 5"; cc.style.color = n>=5 ? "var(--ok)" : "";
      msg.textContent = (n>=5 && words>=80 && words<=100) ? "🎉 Challenge complete!" : "";
    });
    body.append(list, ta, h("div",{class:"wc"}, wc, cc, msg));
    return null;
  }});

/* ---------- 11. FLASHCARDS ---------- */
ACTS.push({stage:4, num:"11", nav:"Flashcards", title:"Test yourself: flashcards",
  instr:"Look at the picture and the meaning. Say the collocation, then tap the card to check. Practise again tomorrow, in 3 days and in a week!",
  build(body){
    const wrap = h("div",{class:"fcwrap"}); body.appendChild(wrap);
    let queue, known, tries;
    function start(){ queue = shuffle(COLL); known = 0; tries = 0; render(); }
    function render(){
      wrap.innerHTML = "";
      if (!queue.length){
        wrap.appendChild(h("div",{class:"fcdone pop"}, h("div",{class:"big"},"🎉"), h("h3",null,"You know all 8 collocations!"),
          h("p",null, `It took you ${tries} tries. Come back tomorrow and try to do it in 8!`),
          h("button",{class:"btn", onclick:start}, "Start again")));
        return;
      }
      const c = queue[0];
      const card = h("div",{class:"fc"}, h("div",{class:"fci"},
        h("div",{class:"face front"}, h("img",{src:IMG[c.img], alt:""}), h("div",{class:"fm"}, "“" + c.meaning + "”")),
        h("div",{class:"face back"}, h("div",{class:"big"}, phraseEl(c)), h("div",{class:"ex"}, c.example), sayBtn(c.short.replace(" sb"," somebody").replace(" sth"," something")))));
      card.addEventListener("click", () => card.classList.toggle("flip"));
      const yes = h("button",{class:"btn ok", onclick:()=>{ tries++; known++; queue.shift(); render(); }}, "✓ I knew it");
      const no = h("button",{class:"btn bad", onclick:()=>{ tries++; queue.push(queue.shift()); render(); }}, "✗ Not yet");
      wrap.append(h("div",{class:"fcstat"}, `Learned: ${known} / 8   ·   Cards left: ${queue.length}`), card,
        h("div",{class:"fcbtns"}, h("button",{class:"btn soft", onclick:()=>card.classList.toggle("flip")}, "↻ Flip"), no, yes));
    }
    start();
    return null;
  }});

/* =================================================================
   APP SHELL
   ================================================================= */
const state = { cur:0, scores:{}, built:{} };
const stepsEl = document.getElementById("steps"), cardEl = document.getElementById("card");

function updateScore(){
  let c=0,t=0; Object.values(state.scores).forEach(([a,b]) => { c+=a; t+=b; });
  const total = ACTS.reduce((s,a,i)=> s + (a.total||0), 0);
  document.getElementById("scoreNum").textContent = `${c} / ${total}`;
  document.getElementById("scoreBar").style.width = (total ? 100*c/total : 0) + "%";
  [...stepsEl.children].forEach((b,i) => { const s = state.scores[i]; b.classList.toggle("done", !!s && s[0]===s[1]); b.classList.toggle("part", !!s && s[0]<s[1]); });
}
function renderSteps(){
  stepsEl.innerHTML = "";
  ACTS.forEach((a,i) => {
    const b = h("button",{class:"step"+(i===state.cur?" active":""), style:`--sc:${STAGES[a.stage].c}`, onclick:()=>go(i)},
      h("span",{class:"dot"}), (a.num ? a.num + " · " : "") + a.nav);
    stepsEl.appendChild(b);
  });
  updateScore();
  const act = stepsEl.children[state.cur]; if (act && act.scrollIntoView) act.scrollIntoView({block:"nearest", inline:"center"});
}
function buildCard(i){
  const a = ACTS[i], st = STAGES[a.stage];
  const body = h("div",{class:"cbody"});
  const wrap = h("div",null,
    h("div",{class:"stagebar", style:`background:${st.c}`}, st.name, h("em",null, st.sub)),
    body);
  body.append(h("h2",null, a.num ? h("b",null, a.num) : null, a.title), h("p",{class:"instr"}, a.instr));
  const content = h("div"); body.appendChild(content);
  const api = a.build(content);
  if (api){
    const fb = h("span",{class:"feedback"});
    const doCheck = () => {
      clearMarks(content);
      const [c,t] = api.check(); state.scores[i] = [c,t];
      fb.className = "feedback show " + (c===t ? "good" : c/t >= .5 ? "mid" : "low");
      fb.textContent = c===t ? `🎉 Perfect! ${c} / ${t}` : `${c} / ${t} correct. ${c/t>=.5 ? "Nearly there! Fix the red ones." : "Keep trying! Fix the red ones."}`;
      if (c===t){ fb.classList.add("pop"); }
      updateScore();
    };
    body.appendChild(h("div",{class:"tools"},
      h("button",{class:"btn", onclick:doCheck}, "✓ Check"),
      h("button",{class:"btn soft", onclick:()=>{ clearMarks(content); api.show(); fb.className="feedback"; }}, "Show answers"),
      h("button",{class:"btn ghost", onclick:()=>{ clearMarks(content); api.reset(); fb.className="feedback"; }}, "↺ Try again"),
      fb));
  }
  return wrap;
}
function go(i){
  state.cur = Math.max(0, Math.min(ACTS.length-1, i));
  if (!state.built[state.cur]) state.built[state.cur] = buildCard(state.cur);
  cardEl.innerHTML = ""; cardEl.appendChild(state.built[state.cur]);
  document.getElementById("prev").style.visibility = state.cur===0 ? "hidden" : "visible";
  const nx = document.getElementById("next");
  nx.style.visibility = state.cur===ACTS.length-1 ? "hidden" : "visible";
  nx.textContent = state.cur===0 ? "Start activities →" : "Next →";
  renderSteps();
  window.scrollTo({top:0, behavior:"smooth"});
}
document.getElementById("prev").onclick = () => go(state.cur-1);
document.getElementById("next").onclick = () => go(state.cur+1);

// totals for the score bar (number of checkable items per activity)
const TOTALS = {1:8, 2:9, 3:8, 4:8, 5:6, 6:9, 7:19, 8:8};
ACTS.forEach((a,i) => a.total = TOTALS[i] || 0);
